name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    name: Repository health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate core files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          find . -maxdepth 3 -type f | sort | head -200

      - name: Lightweight secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(AWS_SECRET_ACCESS_KEY|PRIVATE KEY|api[_-]?key\s*=|token\s*=|password\s*=)' . \
            --exclude-dir=.git \
            --exclude='*.md' \
            --exclude='*.yml' \
            --exclude='*.yaml'; then
            echo "Potential secret-like values found. Review required."
            exit 1
          fi

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: repo-health
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image if Dockerfile exists
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker build -t myapp .

  gitleaks-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    needs: repo-health
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "five-agent-os"
version = "1.1.0"
description = "A practical multi-agent operating model for intake, synthesis, decisions, outreach, and quality control."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "multi-agent", "ai", "workflow", "automation"]
authors = [
    { name = "donny-devops" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9,<1.0"
]

[project.urls]
Repository = "https://github.com/donny-devops/five-agent-os"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (includes UP017 datetime.UTC)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default arguments
    "SIM108", # ternary operator (keep explicit for readability)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]  # allow assert in tests, skip annotations

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]
